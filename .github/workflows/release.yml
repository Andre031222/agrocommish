name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Firmware image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.1.0 --pattern firmware.bin --dir firmware
      - name: Build
        run: pyinstaller AgroCommish.spec --noconfirm
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} dist/AgroCommish.exe firmware/firmware.bin --clobber
